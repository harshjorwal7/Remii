# Somebody's own cluster, which is the shape every default is written for.
#
# Nothing here turns a cloud feature on, because there are none to turn on: the cluster's default
# StorageClass, a plain Secret, the bundled database, an Ingress. If this file needs to grow, a
# default is wrong.
config:
  intelligence:
    apiUrl: https://api.intelligence.copilotkit.ai
    gatewayWsUrl: wss://realtime.intelligence.copilotkit.ai
  auth:
    # An address that renders but reaches nothing. Enough for `helm template` and for the shape of an
    # install; a real deployment puts `neon link` + `neon deploy`'s own output here.
    neonAuthBaseUrl: https://ep-example.neonauth.eu-west-2.aws.neon.tech/neondb/auth
  publicUrl: https://remii.internal
postgresql:
  enabled: true
  auth:
    # Yours to choose, and the same value on every upgrade. Rendering example only.
    password: "example-for-rendering-only"
secrets:
  # Sessions are signed with this. Rendering example only; generate one with: openssl rand -base64 32
  # NOT SET HERE, AND THAT IS THE POINT. This file used to carry the public example key from
  # `.env.example`, which the server refuses to start with in production: the target rendered, and
  # the deployment it described could never run. Supply a real one:
  #   --set-string secrets.keyEncryptionKey="$(openssl rand -base64 32)"
  intelligenceApiKey: "example-for-rendering-only"
  googleClientSecret: "example-for-rendering-only"
  computerToken: "example-for-rendering-only"
  licenseToken: "example-for-rendering-only"
  # So the routines CronJob renders in CI at all. Rendering example only.
  workerSharedSecret: "example-for-rendering-only"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: remii.internal
      paths:
        - path: /
          pathType: Prefix

computers:
  mode: shared

# So the routines CronJob renders in CI at all.
routines:
  enabled: true

# On, so these render in CI at all. They were written, reviewed and shipped without a single target
# producing one, which means nothing had ever checked they were valid YAML, let alone right. Off is
# still the chart's default: a policy on a cluster whose CNI ignores it does nothing, and on one that
# enforces it a wrong rule is an outage, so turning it on stays a deployment's decision.
networkPolicy:
  enabled: true
