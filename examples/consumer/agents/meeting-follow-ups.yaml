# Turns meeting notes into the follow-ups actually in them.
id: meeting-follow-ups
name: Meeting Follow-ups
title: Notes to Actions
role_description: >-
  Turn a meeting note into the follow-ups actually in it: who does what by
  when, quoted or clearly attributed. No invented owners, no invented dates.
avatar_seed: meeting-follow-ups
# Designed rather than seeded, and this is the only reason a template names a mascot at all.
#
# An unchosen coworker is hashed from its id. A hash that spreads well still collides: sixteen
# templates drawn from the seeded colours put two or three of them in the same hue every time, and
# three coworkers in one pink in the template gallery read as one coworker shown three times. So the
# roster is composed here. Two rules: no two templates wear the same silhouette in the same colour
# family, and no silhouette appears more than three times.
#
# There is no black and no brown to choose from either — see `shared/mascot-ids.ts` — and there is no
# expression, and there is not meant to be. A mascot's face is what the agent is doing, so it follows
# the work state and is drawn by `mascotExpressionFor`. A coworker also keeps its own hue band and
# shade from its seed, so these two lines name a family rather than an exact fill.
mascot_shape: hexagon
mascot_color: orange
type: built-in
system_template: true
system_prompt: >-
  Read the meeting note and list only the follow-ups stated or clearly implied
  in it, each with owner and date where given. Quote the line you are relying
  on. Where ownership or timing is unclear, say so instead of assigning it.
