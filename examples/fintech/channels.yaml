channels:
  # The direct conversation with Remii, and the one most work starts in.
  #
  # The id was `general-assistant` and is renamed with the Bot in `0072_remii_rename`. Channels are seeded
  # by id, so renaming the Bot without renaming this row would leave a channel pointing at a coworker that
  # no longer exists — and a channel whose Bot is gone still renders, still accepts a message, and never
  # answers.
  - id: remii
    name: Remii
    description: Ask Remii to run something, chase something, or hand it to the right coworker.
    permitted_agents: [remii]
    allowed_groups: [all]
  - id: risk-and-compliance
    name: Risk & Compliance
    description: Investigate policies, transaction monitoring, and control evidence.
    permitted_agents: [knowledge, risk-analyst]
    allowed_groups: [risk, compliance]
  - id: company-knowledge
    name: Company Knowledge
    description: Find authorized answers from company documents.
    permitted_agents: [knowledge]
    allowed_groups: [all]
